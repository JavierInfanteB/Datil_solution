name: Runner test

# Corre en cada push (y tambien a mano); solo comprueba que el runner responde.
# shell: cmd porque la politica de ejecucion de PowerShell en esta PC bloquea los .ps1 del runner.
on:
  push:
  workflow_dispatch:

jobs:
  ping:
    runs-on: [self-hosted, datil]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Quien corre esto
        run: |
          hostname
          whoami
      - name: Herramientas disponibles
        run: |
          git --version
          python --version
          node --version
      - name: El token personal no debe llegar al job
        run: |
          if defined GITHUB_TOKEN (
            echo GITHUB_TOKEN presente en el entorno del runner
            exit /b 1
          )
          echo ok: sin GITHUB_TOKEN
